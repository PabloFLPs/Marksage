<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved accent before first paint (no colour flash).
      // Rebrand migration: move saved data from the old "markdown-preview:" keys (once).
      try {
        var old = [];
        for (var i = 0; i < localStorage.length; i++) old.push(localStorage.key(i));
        for (var j = 0; j < old.length; j++) {
          var k = old[j];
          if (k && k.indexOf("markdown-preview:") === 0) {
            var nk = "marksage:" + k.slice(17);
            if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(k));
            localStorage.removeItem(k);
          }
        }
      } catch (e) {}
      try {
        var a = localStorage.getItem("marksage:app-icon");
        if (a && a !== "classic" && ["mono", "outline", "sunset"].indexOf(a) >= 0) document.documentElement.dataset.accent = a;
        var l = localStorage.getItem("marksage:lang");
        if (l === "pt-BR" || (!l && /^pt\b/i.test(navigator.language))) document.documentElement.lang = "pt-BR";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marksage — Markdown editor</title>
    <meta name="description" content="The Markdown editor that notices. Local-first — your files never leave the browser — with an on-device assistant that suggests, never overwrites." />
    <meta name="theme-color" content="#0d1117" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (WhatsApp, Slack, Discord, iMessage, LinkedIn, X…).
         %SITE_URL% is filled in at build time from VITE_SITE_URL (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marksage" />
    <meta property="og:title" content="Marksage — the Markdown editor that notices" />
    <meta property="og:description" content="Local-first Markdown editor with live preview, smart paste and an on-device assistant. Your files never leave the browser. EN · PT-BR." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marksage — the Markdown editor that notices. An editor suggesting a code-block language." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marksage — the Markdown editor that notices" />
    <meta name="twitter:description" content="Local-first Markdown editor with an on-device assistant. Your files never leave the browser." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <!-- Boot screen: shown inside #root until React replaces it — on a slow connection the page isn't blank.
         It fades in only after 400 ms, so a fast load never flashes it. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
        font: 500 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: #6b7280; background: #fff;
        animation: boot-in 300ms ease 400ms both; }
      .boot-mark { width: 22px; height: 22px; border-radius: 6px; background: #2563eb; }
      html.boot-dark .boot { background: #0d1117; color: #8b949e; }
      html.boot-dark .boot-mark { background: #58a6ff; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot { animation: none; } }
    </style>
    <script>
      try {
        var t = localStorage.getItem("marksage:theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("boot-dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><span class="boot-mark"></span>Marksage</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
