# The checks every commit runs before it's made (AGENTS.md, "Verify before committing"), on GitHub too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Smart Assist's fixture evaluation: the number of "✗" lines it prints today. A change isn't wrong by itself,
      # but it must be noticed and explained — update this with the commit that changes it.
      EVAL_BASELINE: 1215
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version (scripts/version.ts) and About's commit come from the full history
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests, with coverage (at least 50% of lines)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Bundle-size budget (first-load JS / CSS)
        run: npm run size
      - name: Smart Assist evaluation
        run: |
          npm run eval:assist | tee eval.log
          count=$(grep -c '✗' eval.log || true)
          echo "### Smart Assist evaluation: $count ✗ (baseline $EVAL_BASELINE)" >> "$GITHUB_STEP_SUMMARY"
          grep -Eq '^([0-9]+)/\1 documents as expected' eval.log || { echo "::error::Document fixtures failed"; exit 1; }
          [ "$(grep -c 'largest difference 0.0e+0' eval.log)" -eq 2 ] || { echo "::error::Standalone runner parity failed"; exit 1; }
          [ "$count" -eq "$EVAL_BASELINE" ] || { echo "::error::Eval changed: $count ✗, baseline $EVAL_BASELINE"; exit 1; }
      - name: Version matches the history
        run: npm run version:check

  e2e:
    # The real app in a browser (tests/e2e): the production build, desktop and phone Chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npx playwright test
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  e2e-cross-browser:
    # The same suite in WebKit (Safari's engine: desktop and iPhone) and Firefox. Blocking since its first green run
    # (2026-11-05); it can't run where it was written, so a failure here is the first word on a WebKit / Firefox bug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browsers
        run: npx playwright install --with-deps webkit firefox
      - name: Build
        run: npm run build
      - name: End-to-end tests (WebKit, Firefox)
        run: npx playwright test --project=webkit --project=firefox --project=iphone
        env:
          CROSS_BROWSER: '1'
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces-cross-browser
          path: test-results
          retention-days: 7
