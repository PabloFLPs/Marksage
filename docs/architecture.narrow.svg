<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1074" width="360" height="1074" role="img" aria-labelledby="msd-title-n msd-desc-n" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="msd-title-n">How Smart Assist works</title><desc id="msd-desc-n">Two flows: suggestions in the editor, and the Outline panel.</desc>
<style>
  .msd-lane { fill: none; stroke: #d8dee4; }
  .msd-lane-t { fill: #2563eb; font-size: 11px; font-weight: 600; letter-spacing: .08em; }
  .msd-box { fill: #f6f8fa; stroke: #d0d7de; }
  .msd-box.msd-accent { stroke: #2563eb; stroke-width: 1.5; }
  .msd-box.msd-dashed, .msd-group { stroke-dasharray: 4 3; }
  .msd-group { fill: none; stroke: #8c959f; }
  .msd-t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .msd-s { fill: #59636e; font-size: 12px; }
  .msd-s.msd-small { font-size: 11px; }
  .msd-label { fill: #59636e; font-size: 11px; }
  .msd-note { fill: #59636e; font-size: 11.5px; font-style: italic; }
  .msd-mono { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .msd-step { fill: #2563eb; font-size: 11px; font-weight: 700; }
  .msd-line { fill: none; stroke: #8c959f; stroke-width: 1.4; }
  .msd-head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .msd-lane { stroke: #30363d; }
    .msd-lane-t { fill: #58a6ff; }
    .msd-box { fill: #161b22; stroke: #30363d; }
    .msd-box.msd-accent { stroke: #58a6ff; }
    .msd-group { stroke: #6e7681; }
    .msd-t { fill: #e6edf3; }
    .msd-s, .msd-label, .msd-note, .msd-mono { fill: #8b949e; }
    .msd-step { fill: #58a6ff; }
    .msd-line { stroke: #6e7681; }
    .msd-head { fill: #6e7681; }
  }
</style>
<defs><marker id="msd-arrow-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="msd-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="msd-lane" x="8" y="8" width="344" height="536" rx="14"/>
<text class="msd-lane-t" x="24" y="30">SUGGESTIONS</text>
<rect class="msd-box " x="24" y="44" width="312" height="54" rx="9"/><text class="msd-t" x="180.0" y="67.0" text-anchor="middle">Editor</text><text class="msd-s" x="180.0" y="84.0" text-anchor="middle">typing pause 400 ms · paste · 2 s idle</text>
<path class="msd-line" d="M180,98 L180,121" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box " x="24" y="122" width="312" height="54" rx="9"/><text class="msd-t" x="180.0" y="145.0" text-anchor="middle">Pre-filter</text><text class="msd-s" x="180.0" y="162.0" text-anchor="middle">finds a candidate — none: stop here</text>
<rect class="msd-group" x="16" y="200" width="328" height="102" rx="12"/>
<path class="msd-line" d="M180,176 L180,190"/>
<path class="msd-line" d="M100,190 L260,190"/>
<path class="msd-line" d="M100,190 L100,211" marker-end="url(#msd-arrow-n)"/>
<path class="msd-line" d="M260,190 L260,211" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box " x="24" y="212" width="152" height="60" rx="9"/><text class="msd-t" x="100.0" y="238.0" text-anchor="middle">Heuristics</text><text class="msd-s msd-small" x="100.0" y="255.0" text-anchor="middle">always ready</text>
<rect class="msd-box " x="184" y="212" width="152" height="60" rx="9"/><text class="msd-t" x="260.0" y="238.0" text-anchor="middle">Local model</text><text class="msd-s msd-small" x="260.0" y="255.0" text-anchor="middle">own models + heuristics</text>
<text class="msd-label" x="180" y="291" text-anchor="middle">Decision engine · choice / score / noul</text>
<path class="msd-line" d="M180,302 L180,323" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box msd-accent" x="24" y="324" width="312" height="54" rx="9"/><text class="msd-t" x="180.0" y="347.0" text-anchor="middle">Confidence gate</text><text class="msd-s" x="180.0" y="364.0" text-anchor="middle">top ≥ 0.8 and ahead by ≥ 0.2</text>
<path class="msd-line" d="M180,378 L180,401" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box " x="24" y="402" width="312" height="54" rx="9"/><text class="msd-t" x="180.0" y="425.0" text-anchor="middle">Feature + converter</text><text class="msd-s" x="180.0" y="442.0" text-anchor="middle">builds the edit: table, list, fence</text>
<path class="msd-line" d="M180,456 L180,479" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box " x="24" y="480" width="312" height="54" rx="9"/><text class="msd-t" x="180.0" y="503.0" text-anchor="middle">Suggestion bar</text><text class="msd-s" x="180.0" y="520.0" text-anchor="middle">Tab accept · Esc dismiss · undo works</text>
<g transform="translate(-360 552)">
<rect class="msd-lane" x="368" y="8" width="344" height="506" rx="14"/>
<text class="msd-lane-t" x="384" y="30">OUTLINE &amp; DOCUMENT</text>
<rect class="msd-box " x="384" y="44" width="268" height="54" rx="9"/><text class="msd-t" x="518.0" y="67.0" text-anchor="middle">Document</text><text class="msd-s" x="518.0" y="84.0" text-anchor="middle">the text you are reading or editing</text>
<path class="msd-line" d="M518,98 L518,121" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box " x="384" y="122" width="268" height="54" rx="9"/><text class="msd-t" x="518.0" y="145.0" text-anchor="middle">Sections</text><text class="msd-s" x="518.0" y="162.0" text-anchor="middle">split at headings, code skipped</text>
<path class="msd-line" d="M518,176 L518,199" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box " x="384" y="200" width="268" height="54" rx="9"/><text class="msd-t" x="518.0" y="223.0" text-anchor="middle">Heading rule</text><text class="msd-s" x="518.0" y="240.0" text-anchor="middle">“Installation” → Setup</text>
<path class="msd-line" d="M518,254 L518,289" marker-end="url(#msd-arrow-n)"/>
<text class="msd-label" x="526" y="276">heading says nothing</text>
<rect class="msd-box msd-dashed" x="384" y="290" width="268" height="60" rx="9"/><text class="msd-t" x="518.0" y="316.0" text-anchor="middle">Section model</text><text class="msd-s" x="518.0" y="333.0" text-anchor="middle">Local model mode · reads the text</text>
<path class="msd-line" d="M652,227 L680,227 L680,386"/>
<text class="msd-label" x="690" y="306" text-anchor="middle" transform="rotate(90 690 306)">typed</text>
<path class="msd-line" d="M518,350 L518,386"/>
<path class="msd-line" d="M458,386 L680,386"/>
<path class="msd-line" d="M458,386 L458,409" marker-end="url(#msd-arrow-n)"/>
<path class="msd-line" d="M622,386 L622,409" marker-end="url(#msd-arrow-n)"/>
<rect class="msd-box " x="384" y="410" width="148" height="60" rx="9"/><text class="msd-t" x="458.0" y="436.0" text-anchor="middle">Outline tab</text><text class="msd-s msd-small" x="458.0" y="453.0" text-anchor="middle">type + key sentence</text>
<rect class="msd-box " x="548" y="410" width="148" height="60" rx="9"/><text class="msd-t" x="622.0" y="436.0" text-anchor="middle">Document tab</text><text class="msd-s msd-small" x="622.0" y="453.0" text-anchor="middle">facts · tone · flags</text>
<text class="msd-note" x="540" y="500" text-anchor="middle">Visual only — never edits</text>
</g>
</svg>
