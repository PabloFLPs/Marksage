<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 572" width="440" height="572" role="img" aria-labelledby="msd-title-models-training msd-desc-models-training" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="msd-title-models-training">Como os modelos aprenderam</title><desc id="msd-desc-models-training">O fluxo de treino, dos repositórios públicos aos números publicados.</desc>
<style>
  .msd-lane { fill: none; stroke: #d8dee4; }
  .msd-lane-t { fill: #2563eb; font-size: 11px; font-weight: 600; letter-spacing: .08em; }
  .msd-box { fill: #f6f8fa; stroke: #d0d7de; }
  .msd-box.msd-accent { stroke: #2563eb; stroke-width: 1.5; }
  .msd-box.msd-dashed, .msd-group { stroke-dasharray: 4 3; }
  .msd-group { fill: none; stroke: #8c959f; }
  .msd-t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .msd-s { fill: #59636e; font-size: 12px; }
  .msd-s.msd-small { font-size: 11px; }
  .msd-label { fill: #59636e; font-size: 11px; }
  .msd-note { fill: #59636e; font-size: 11.5px; font-style: italic; }
  .msd-mono { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .msd-step { fill: #2563eb; font-size: 11px; font-weight: 700; }
  .msd-line { fill: none; stroke: #8c959f; stroke-width: 1.4; }
  .msd-head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .msd-lane { stroke: #30363d; }
    .msd-lane-t { fill: #58a6ff; }
    .msd-box { fill: #161b22; stroke: #30363d; }
    .msd-box.msd-accent { stroke: #58a6ff; }
    .msd-group { stroke: #6e7681; }
    .msd-t { fill: #e6edf3; }
    .msd-s, .msd-label, .msd-note, .msd-mono { fill: #8b949e; }
    .msd-step { fill: #58a6ff; }
    .msd-line { stroke: #6e7681; }
    .msd-head { fill: #6e7681; }
  }
</style>
<defs><marker id="msd-arrow-models-training" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="msd-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="msd-box " x="20" y="24" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="46">1</text>
<text class="msd-t" x="52" y="46">Repositórios públicos</text>
<text class="msd-mono" x="52" y="66">309 repositórios: docs, READMEs, guias</text>
<path class="msd-line" d="M200.0,80 L200.0,101" marker-end="url(#msd-arrow-models-training)"/>
<rect class="msd-box " x="20" y="102" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="124">2</text>
<text class="msd-t" x="52" y="124">Exemplos rotulados</text>
<text class="msd-mono" x="52" y="144">código: as tags dos autores · seções: títulos</text>
<path class="msd-line" d="M200.0,158 L200.0,179" marker-end="url(#msd-arrow-models-training)"/>
<rect class="msd-box " x="20" y="180" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="202">3</text>
<text class="msd-t" x="52" y="202">Divisão por repositório</text>
<text class="msd-mono" x="52" y="222">treino · ajuste (escolhas) · teste (uma vez)</text>
<path class="msd-line" d="M200.0,236 L200.0,257" marker-end="url(#msd-arrow-models-training)"/>
<rect class="msd-box msd-accent" x="20" y="258" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="280">4</text>
<text class="msd-t" x="52" y="280">Laço de treino</text>
<text class="msd-mono" x="52" y="300">chuta → mede o erro → ajusta os números</text>
<path class="msd-line" d="M200.0,314 L200.0,335" marker-end="url(#msd-arrow-models-training)"/>
<rect class="msd-box " x="20" y="336" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="358">5</text>
<text class="msd-t" x="52" y="358">Calibra</text>
<text class="msd-mono" x="52" y="378">temperatura em repositórios nunca vistos</text>
<path class="msd-line" d="M200.0,392 L200.0,413" marker-end="url(#msd-arrow-models-training)"/>
<rect class="msd-box " x="20" y="414" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="436">6</text>
<text class="msd-t" x="52" y="436">Encolhe</text>
<text class="msd-mono" x="52" y="456">8 bits + uma escala por linha → 385 KB</text>
<path class="msd-line" d="M200.0,470 L200.0,491" marker-end="url(#msd-arrow-models-training)"/>
<rect class="msd-box " x="20" y="492" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="514">7</text>
<text class="msd-t" x="52" y="514">Mede uma vez</text>
<text class="msd-mono" x="52" y="534">repositórios de fora → os números publicados</text>
<path class="msd-line" d="M380,300 L402,300 L402,272 L381,272" marker-end="url(#msd-arrow-models-training)"/>
<text class="msd-label" x="414" y="286.0" text-anchor="middle" transform="rotate(90 414 286.0)">× várias passadas</text>
</svg>
