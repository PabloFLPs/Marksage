<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 650" width="440" height="650" role="img" aria-labelledby="msd-title-models-inference msd-desc-models-inference" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="msd-title-models-inference">From a snippet to an answer</title><desc id="msd-desc-models-inference">How the code-language model turns a snippet into probabilities, with real numbers.</desc>
<style>
  .msd-lane { fill: none; stroke: #d8dee4; }
  .msd-lane-t { fill: #2563eb; font-size: 11px; font-weight: 600; letter-spacing: .08em; }
  .msd-box { fill: #f6f8fa; stroke: #d0d7de; }
  .msd-box.msd-accent { stroke: #2563eb; stroke-width: 1.5; }
  .msd-box.msd-dashed, .msd-group { stroke-dasharray: 4 3; }
  .msd-group { fill: none; stroke: #8c959f; }
  .msd-t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .msd-s { fill: #59636e; font-size: 12px; }
  .msd-s.msd-small { font-size: 11px; }
  .msd-label { fill: #59636e; font-size: 11px; }
  .msd-note { fill: #59636e; font-size: 11.5px; font-style: italic; }
  .msd-mono { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .msd-step { fill: #2563eb; font-size: 11px; font-weight: 700; }
  .msd-line { fill: none; stroke: #8c959f; stroke-width: 1.4; }
  .msd-head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .msd-lane { stroke: #30363d; }
    .msd-lane-t { fill: #58a6ff; }
    .msd-box { fill: #161b22; stroke: #30363d; }
    .msd-box.msd-accent { stroke: #58a6ff; }
    .msd-group { stroke: #6e7681; }
    .msd-t { fill: #e6edf3; }
    .msd-s, .msd-label, .msd-note, .msd-mono { fill: #8b949e; }
    .msd-step { fill: #58a6ff; }
    .msd-line { stroke: #6e7681; }
    .msd-head { fill: #6e7681; }
  }
</style>
<defs><marker id="msd-arrow-models-inference" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="msd-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="msd-box " x="20" y="24" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="46">1</text>
<text class="msd-t" x="52" y="46">Snippet</text>
<text class="msd-mono" x="52" y="66">def greet(name): return f&quot;Hello…&quot;</text>
<path class="msd-line" d="M200.0,80 L200.0,101" marker-end="url(#msd-arrow-models-inference)"/>
<rect class="msd-box " x="20" y="102" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="124">2</text>
<text class="msd-t" x="52" y="124">Clues (features)</text>
<text class="msd-mono" x="52" y="144">55 clues: T:def  F:return  G:gre  E::</text>
<path class="msd-line" d="M200.0,158 L200.0,179" marker-end="url(#msd-arrow-models-inference)"/>
<rect class="msd-box " x="20" y="180" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="202">3</text>
<text class="msd-t" x="52" y="202">Hash each clue to a slot</text>
<text class="msd-mono" x="52" y="222">T:def → slot 23,610 of 32,768</text>
<path class="msd-line" d="M200.0,236 L200.0,257" marker-end="url(#msd-arrow-models-inference)"/>
<rect class="msd-box " x="20" y="258" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="280">4</text>
<text class="msd-t" x="52" y="280">Look up 8 numbers per slot</text>
<text class="msd-mono" x="52" y="300">55 clues × 8 learned numbers</text>
<path class="msd-line" d="M200.0,314 L200.0,335" marker-end="url(#msd-arrow-models-inference)"/>
<rect class="msd-box " x="20" y="336" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="358">5</text>
<text class="msd-t" x="52" y="358">Average them</text>
<text class="msd-mono" x="52" y="378">[0.11, −0.23, 0.32, 0.02, …]</text>
<path class="msd-line" d="M200.0,392 L200.0,413" marker-end="url(#msd-arrow-models-inference)"/>
<rect class="msd-box " x="20" y="414" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="436">6</text>
<text class="msd-t" x="52" y="436">Score each answer</text>
<text class="msd-mono" x="52" y="456">python 16.7 · yaml 10.5 · markdown 8.6 …</text>
<path class="msd-line" d="M200.0,470 L200.0,491" marker-end="url(#msd-arrow-models-inference)"/>
<rect class="msd-box " x="20" y="492" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="514">7</text>
<text class="msd-t" x="52" y="514">Softmax, temperature 2.55</text>
<text class="msd-mono" x="52" y="534">python 83% · yaml 7% · markdown 4% …</text>
<path class="msd-line" d="M200.0,548 L200.0,569" marker-end="url(#msd-arrow-models-inference)"/>
<rect class="msd-box msd-accent" x="20" y="570" width="360" height="56" rx="9"/>
<text class="msd-step" x="34" y="592">8</text>
<text class="msd-t" x="52" y="592">Confidence gate</text>
<text class="msd-mono" x="52" y="612">83% ≥ 80% and 75 points ahead → “python”</text>
</svg>
